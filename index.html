<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drone FBD Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    padding: 8px;
    touch-action: manipulation;
  }
  h1 { font-size: 1.1rem; text-align: center; margin-bottom: 6px; color: #fff; }
  #canvas-wrap {
    width: 100%;
    background: #1a1d24;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label {
    font-size: 0.85rem;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  input[type="range"] {
    width: 100%;
    height: 28px;
    accent-color: #4fc3f7;
  }
  #info {
    background: #1e222a;
    border-radius: 8px;
    padding: 10px;
    font-size: 0.82rem;
    line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre-line;
  }
  .reset {
    background: #333;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
    margin-top: 6px;
  }
</style>
</head>
<body>
<h1>Drone Free-Body Diagram</h1>
<div id="canvas-wrap">
  <canvas id="c" width="800" height="480"></canvas>
</div>
<div class="controls">
  <div class="slider-row">
    <label>Pitch <span id="pitch-val">0°</span></label>
    <input type="range" id="pitch" min="-45" max="45" value="0" step="0.5">
  </div>
  <div class="slider-row">
    <label>Range X <span id="x-val">50 m</span></label>
    <input type="range" id="x" min="10" max="90" value="50" step="1">
  </div>
  <div class="slider-row">
    <label>Altitude <span id="z-val">30 m</span></label>
    <input type="range" id="z" min="8" max="55" value="30" step="1">
  </div>
</div>
<button class="reset" id="reset">Reset</button>
<div id="info"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const pitchSlider = document.getElementById('pitch');
const xSlider = document.getElementById('x');
const zSlider = document.getElementById('z');
const pitchVal = document.getElementById('pitch-val');
const xVal = document.getElementById('x-val');
const zVal = document.getElementById('z-val');
const info = document.getElementById('info');
const resetBtn = document.getElementById('reset');

// World scale: meters to canvas pixels
const SCALE = 6.5;          // px per meter
const ORIGIN_X = 80;        // canvas x of GS
const ORIGIN_Y = 420;       // canvas y of ground

function worldToCanvas(wx, wz) {
  return {
    x: ORIGIN_X + wx * SCALE,
    y: ORIGIN_Y - wz * SCALE
  };
}

function rot(vec, pitchRad) {
  const c = Math.cos(pitchRad);
  const s = Math.sin(pitchRad);
  return [c * vec[0] - s * vec[1], s * vec[0] + c * vec[1]];
}

function drawArrow(from, to, color, width = 2.5) {
  const headLen = 12;
  const angle = Math.atan2(to.y - from.y, to.x - from.x);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(to.x, to.y);
  ctx.lineTo(to.x - headLen * Math.cos(angle - Math.PI / 6), to.y - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(to.x - headLen * Math.cos(angle + Math.PI / 6), to.y - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

function update() {
  const pitchDeg = parseFloat(pitchSlider.value);
  const droneX = parseFloat(xSlider.value);
  const droneZ = parseFloat(zSlider.value);
  const pitchRad = pitchDeg * Math.PI / 180;

  pitchVal.textContent = pitchDeg.toFixed(1) + '°';
  xVal.textContent = droneX + ' m';
  zVal.textContent = droneZ + ' m';

  // Clear
  ctx.fillStyle = '#1a1d24';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, ORIGIN_Y);
  ctx.lineTo(canvas.width, ORIGIN_Y);
  ctx.stroke();

  // Ground station
  const gs = worldToCanvas(0, 0);
  ctx.fillStyle = '#4a90c2';
  ctx.fillRect(gs.x - 18, gs.y - 8, 36, 16);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(gs.x - 18, gs.y - 8, 36, 16);
  ctx.fillStyle = '#ccc';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Ground Station', gs.x, gs.y + 28);

  // Drone position
  const dronePos = worldToCanvas(droneX, droneZ);

  // Body rectangle (body frame: length 2.2 m, height 0.45 m)
  const halfL = 1.1;
  const halfH = 0.22;
  const corners = [
    [-halfL, -halfH],
    [ halfL, -halfH],
    [ halfL,  halfH],
    [-halfL,  halfH]
  ].map(p => rot(p, pitchRad));

  ctx.beginPath();
  const first = worldToCanvas(droneX + corners[0][0], droneZ + corners[0][1]);
  ctx.moveTo(first.x, first.y);
  for (let i = 1; i < 4; i++) {
    const p = worldToCanvas(droneX + corners[i][0], droneZ + corners[i][1]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = '#555';
  ctx.fill();
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Rotors
  const rotorOffs = [[-0.9, 0], [0.9, 0]];
  rotorOffs.forEach(off => {
    const r = rot(off, pitchRad);
    const p = worldToCanvas(droneX + r[0], droneZ + r[1]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
  });

  // Body axes
  const bodyUp = rot([0, 1], pitchRad);
  const bodyFwd = rot([1, 0], pitchRad);

  // FG (gravity) straight down
  const fgEnd = worldToCanvas(droneX, droneZ - 4);
  drawArrow(dronePos, fgEnd, '#ff4444', 3);
  ctx.fillStyle = '#ff4444';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('FG', fgEnd.x + 6, fgEnd.y + 4);

  // True vertical (zenith)
  const zenithEnd = worldToCanvas(droneX, droneZ + 5);
  ctx.strokeStyle = '#4fc3f7';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(dronePos.x, dronePos.y);
  ctx.lineTo(zenithEnd.x, zenithEnd.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#4fc3f7';
  ctx.fillText('Zenith', zenithEnd.x + 6, zenithEnd.y - 4);

  // Thrust along body up
  const thrustLen = 3.8;
  const thrustEndW = [droneX + bodyUp[0] * thrustLen, droneZ + bodyUp[1] * thrustLen];
  const thrustEnd = worldToCanvas(thrustEndW[0], thrustEndW[1]);
  drawArrow(dronePos, thrustEnd, '#66bb6a', 2.5);

  // GPS marker (slightly above CG in body)
  const gpsOff = rot([0, 0.18], pitchRad);
  const gpsW = worldToCanvas(droneX + gpsOff[0], droneZ + gpsOff[1]);
  ctx.beginPath();
  ctx.arc(gpsW.x, gpsW.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#4fc3f7';
  ctx.fill();

  // Body vertical from GPS
  const gpsUpEndW = [droneX + gpsOff[0] + bodyUp[0] * 2.4, droneZ + gpsOff[1] + bodyUp[1] * 2.4];
  const gpsUpEnd = worldToCanvas(gpsUpEndW[0], gpsUpEndW[1]);
  drawArrow(gpsW, gpsUpEnd, '#4fc3f7', 1.8);

  // RF antenna on drone (slightly forward)
  const rfOff = rot([0.15, 0.08], pitchRad);
  const rfW = worldToCanvas(droneX + rfOff[0], droneZ + rfOff[1]);
  ctx.fillStyle = '#ff9800';
  ctx.fillRect(rfW.x - 4, rfW.y - 4, 8, 8);

  // LOS from GS to RF
  ctx.strokeStyle = '#e040fb';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(gs.x, gs.y);
  ctx.lineTo(rfW.x, rfW.y);
  ctx.stroke();

  // RF boresight (body forward)
  const boreEndW = [droneX + rfOff[0] + bodyFwd[0] * 2.8, droneZ + rfOff[1] + bodyFwd[1] * 2.8];
  const boreEnd = worldToCanvas(boreEndW[0], boreEndW[1]);
  drawArrow(rfW, boreEnd, '#ff9800', 1.8);

  // GS panel normal along LOS
  const losDx = rfW.x - gs.x;
  const losDy = rfW.y - gs.y;
  const losLen = Math.hypot(losDx, losDy);
  const losUx = losDx / losLen;
  const losUy = losDy / losLen;
  const gsNormEnd = { x: gs.x + losUx * 40, y: gs.y + losUy * 40 };
  drawArrow(gs, gsNormEnd, '#ab47bc', 1.8);

  // --- Angles ---
  // GPS angle from true vertical (body up vs [0,1])
  const gpsAngle = Math.atan2(bodyUp[0], bodyUp[1]) * 180 / Math.PI;

  // LOS elevation (from horizontal)
  const losElev = Math.atan2(droneZ - 0, droneX - 0) * 180 / Math.PI;

  // RF boresight from horizontal
  const rfBoreAngle = Math.atan2(bodyFwd[1], bodyFwd[0]) * 180 / Math.PI;

  // Misalignment: angle between body forward and LOS unit (in world)
  const losUnit = [droneX / Math.hypot(droneX, droneZ), droneZ / Math.hypot(droneX, droneZ)];
  const dot = bodyFwd[0] * losUnit[0] + bodyFwd[1] * losUnit[1];
  const misalign = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;

  info.textContent =
`Pitch: ${pitchDeg.toFixed(1)}°   (+ = nose up)

GPS antenna vs vertical (FG): ${gpsAngle.toFixed(1)}°

LOS distance: ${Math.hypot(droneX, droneZ).toFixed(1)} m
LOS elevation (from horiz): ${losElev.toFixed(1)}°
GS panel tracking angle: ${losElev.toFixed(1)}°

Drone RF boresight from horiz: ${rfBoreAngle.toFixed(1)}°
RF misalignment to LOS: ${misalign.toFixed(1)}°`;
}

pitchSlider.oninput = update;
xSlider.oninput = update;
zSlider.oninput = update;
resetBtn.onclick = () => {
  pitchSlider.value = 0;
  xSlider.value = 50;
  zSlider.value = 30;
  update();
};

// Initial draw
update();

// Handle high-DPI / resize roughly
function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth;
  const h = Math.round(w * 0.6);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
